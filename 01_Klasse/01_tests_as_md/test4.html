<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        position: relative;
        width: 400px;
        height: 300px;
        background-color: lightgray;
      }

      .box1 {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 100px;
        height: 100px;
        background-color: red;
      }

      .box2 {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 200px;
        height: 200px;
        background-color: blue;
      }

      .box3 {
        position: relative;
        right: 40px;
        width: 60px;
        height: 60px;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box1">Box 1</div>
      <div class="box2">Box 2</div>
      <div class="box3">Box 3</div>
    </div>
  </body>
</html>
